[package]
name = "pevv-transport"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "PEVV device transport: PSP/1 sync protocol, identity sealing and pairing over the Transferd overlay (ciphertext only, off by default)"
publish = false

# A stand-alone workspace: the Tauri shell and the Android build pick this crate up by path
# later (docs/TRANSPORT.md, phases 3 and 5). Nothing else in the repository depends on it yet.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Pure PSP/1 protocol code (codec, decision rules, engine over any byte stream). No network.
default = []
# The Transferd overlay transport. Off by default: the build then has no network code at all.
overlay = ["dep:transferd-overlay"]
# UniFFI bindings for Android (implies overlay).
ffi = ["overlay", "dep:uniffi"]
# Builds the `uniffi-bindgen` helper used to generate the Kotlin bindings (generation only).
bindgen = ["ffi", "uniffi/cli"]

[dependencies]
blake3 = "1"
bip39 = { version = "2", default-features = false }
hex = "0.4"
parking_lot = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "net", "macros"] }
zeroize = "1"

# Pinned to a full commit of TransferDaemon main. Never a branch: a moving dependency under a
# password manager is not acceptable. Bump deliberately, with a review of the diff.
transferd-overlay = { git = "https://github.com/LoopyLuci/TransferDaemon", rev = "270f79b67c8e30b7a3d53eaf71e3421e936462bf", optional = true }
uniffi = { version = "0.28", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
