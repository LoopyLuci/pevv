org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7 is tested up to API 35; the app compiles against API 36 (Android 16).
android.suppressUnsupportedCompileSdk=36

# Optional sync backend, the same two values as VITE_PEVV_SYNC_URL / VITE_PEVV_SYNC_ANON_KEY on the web build.
# Leave them empty: sync is then off. Put real values in ~/.gradle/gradle.properties or pass -P on the command line.
# (Environment variables of the same names also work.) Never commit real values.
# pevv.syncUrl=
# pevv.syncAnonKey=
# pevv.rpId=
