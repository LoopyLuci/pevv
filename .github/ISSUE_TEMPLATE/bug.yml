name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Do not file it here. Use the [private advisory form](https://github.com/LoopyLuci/pevv/security/advisories/new).
        **Never paste a real vault file, password, recovery code or token.**
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Web app, Browser extension, Desktop app, Build / CI / docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.2.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / OS and version
      placeholder: "Chrome 130 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots (with secrets removed)
