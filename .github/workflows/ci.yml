name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, unit tests, builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
      - name: Upload unpacked extension
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-unpacked
          path: |
            dist-extension
            dist-extension-firefox
          retention-days: 7

  e2e:
    name: End-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: js
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium (Linux, with system deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run build
      - run: npm run build:extension
      - name: Web app e2e
        run: npm run test:e2e
      - name: Extension e2e
        run: npm run test:e2e:extension
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.os }}
          path: test-results
          retention-days: 7

  android:
    name: Android app (unit tests, lint, unsigned release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fresh golden vectors from the TypeScript code (random keys each run): the Kotlin tests must open all of them.
      - name: Generate golden vectors from the TypeScript code
        run: node scripts/android-vectors.mjs
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests, lint, debug build, unsigned release build
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash ./gradlew test lint assembleDebug assembleRelease --console=plain
      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
