name: Release

# Builds the extension zips, the static web app and the desktop installers (NSIS, MSI, AppImage, deb)
# and the unsigned Android APK when a tag v* is pushed, and attaches them to a DRAFT GitHub release. The installers are not code-signed
# (see docs/RELEASING.md); the desktop updater artifacts are signed with TAURI_SIGNING_PRIVATE_KEY when that secret exists.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  extension-and-web:
    name: Extension zips and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:extension
      - run: npm run build
      - name: Zip the web app
        run: cd dist && zip -qr ../dist.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension-web
          path: |
            dist-extension-zips/*.zip
            dist.zip
          if-no-files-found: error

  desktop:
    name: Desktop installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libudev-dev libxdo-dev patchelf build-essential pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      # With the two secrets the build also writes the updater signatures (*.sig); without them (forks) it skips them.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      # Signs with the repo's release key when the PEVV_KEYSTORE_* secrets exist (forks: unsigned).
      - name: Unit tests and release build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.PEVV_KEYSTORE_BASE64 }}
          PEVV_KEYSTORE_PASSWORD: ${{ secrets.PEVV_KEYSTORE_PASSWORD }}
          PEVV_KEY_ALIAS: ${{ secrets.PEVV_KEY_ALIAS }}
          PEVV_KEY_PASSWORD: ${{ secrets.PEVV_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pevv.jks"
            export PEVV_KEYSTORE_FILE="$RUNNER_TEMP/pevv.jks"
          fi
          bash ./gradlew test assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/pevv.jks"
      - name: Name the APK
        run: |
          out=android/app/build/outputs/apk/release
          if [ -f "$out/app-release.apk" ]; then cp "$out/app-release.apk" "pevv-android-${GITHUB_REF_NAME}.apk"
          else cp "$out/app-release-unsigned.apk" "pevv-android-${GITHUB_REF_NAME}-unsigned.apk"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: pevv-android-*.apk
          if-no-files-found: error

  publish:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [extension-and-web, desktop, android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          # Artifacts arrive in sub-folders (nsis/, msi/, ...): flatten them first.
          find assets -mindepth 2 -type f -exec mv -t assets {} +
          find assets -mindepth 1 -type d -empty -delete
          # The updater manifest, only when the installers were signed (see scripts/make-latest-json.mjs).
          node scripts/make-latest-json.mjs assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          body: |
            **Not code-signed.** The Windows installers have no Authenticode signature (SmartScreen will warn) and the Linux packages are not signed. The desktop app only installs updates that carry PEVV's update signature (`latest.json`, `*.sig`).
            The Android APK is unsigned and must be signed before it can be installed (docs/ANDROID.md). Verify downloads with `SHA256SUMS`. The extension zips are not store-signed; see docs/RELEASING.md.
          files: assets/*
