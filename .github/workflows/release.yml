name: Release

# Builds the extension zips, the static web app and the desktop installers (NSIS, MSI, AppImage, deb)
# and the unsigned Android APK when a tag v* is pushed, and attaches them to a DRAFT GitHub release. Nothing is signed (see docs/RELEASING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  extension-and-web:
    name: Extension zips and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:extension
      - run: npm run build
      - name: Zip the web app
        run: cd dist && zip -qr ../dist.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension-web
          path: |
            dist-extension-zips/*.zip
            dist.zip
          if-no-files-found: error

  desktop:
    name: Desktop installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libdbus-1-dev libudev-dev libxdo-dev patchelf build-essential pkg-config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Build installers (unsigned)
        run: npm run desktop:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      # No keystore is configured here: the APK is unsigned (see docs/ANDROID.md for signing it yourself).
      - name: Unit tests and unsigned release build
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash ./gradlew test assembleRelease --console=plain
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk "pevv-android-${GITHUB_REF_NAME}-unsigned.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: pevv-android-*-unsigned.apk
          if-no-files-found: error

  publish:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [extension-and-web, desktop, android]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          body: |
            **Unsigned builds.** The Windows installers are not code-signed (SmartScreen will warn) and the Linux packages are not signed.
            The Android APK is unsigned and must be signed before it can be installed (docs/ANDROID.md). Verify downloads with `SHA256SUMS`. The extension zips are not store-signed; see docs/RELEASING.md.
          files: assets/*
