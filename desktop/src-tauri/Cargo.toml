[package]
name = "pevv-desktop"
version = "0.2.2"
description = "PEVV desktop: the PEVV vault UI in a Tauri shell"
edition = "2021"
rust-version = "1.77"
publish = false
# `cargo run` / `tauri dev` start the app, not the native-messaging host next to it.
default-run = "pevv-desktop"

[features]
default = ["transferd"]
# PEVV as a Windows 11 passkey provider (plugin authenticator): COM class, registration, CTAP/CBOR codec.
# Off by default: it only does anything from an MSIX install on Windows 11 (docs/PEVV_DESKTOP.md).
win-passkey-provider = ["dep:ciborium", "dep:windows-core", "windows/Win32_System_Com"]
# Device-to-device sync over the Transferd overlay (docs/TRANSPORT.md). On by default (the release build is clean with
# it); `--no-default-features` leaves it out. Links ../../transport/pevv-transport
# with its `overlay` feature. Compiled in, but the run-time switch is off until the person turns it on in
# Settings, and there is no relay unless they add one. Without the feature the commands answer "not in this build".
transferd = ["dep:pevv-transport", "dep:tokio"]

[lib]
name = "pevv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
arboard = { version = "3", default-features = false }
sha2 = "0.11"
base64 = "0.22"
url = "2"
ciborium = { version = "0.2", optional = true }
pevv-transport = { path = "../../transport/pevv-transport", features = ["overlay"], optional = true }
tokio = { version = "1", default-features = false, features = ["sync", "time"], optional = true }

[target.'cfg(windows)'.dependencies]
# Turns WebView2's form autofill off (it would write typed field values to the profile in plaintext).
webview2-com = "0.39"
# The `windows-core` that webview2-com is built on (the `windows` 0.61 above is a different copy).
windows-core-webview = { package = "windows-core", version = "0.62" }
# The COM macros (`implement`, `interface`) name this crate in what they generate.
windows-core = { version = "0.61", optional = true }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Networking_WindowsWebServices",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_LibraryLoader",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }
ctap-hid-fido2 = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
